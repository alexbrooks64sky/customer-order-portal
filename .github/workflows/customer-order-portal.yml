name: Customer Order Portal CI

on:
  push:
    branches:
      - main
      - '2-add-devops-deployment-pipeline'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run automated tests with coverage
        run: npm run test:coverage

      - name: Validate application
        run: node src/app.js
  deploy-dev:
    name: Deploy DEV
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to DEV
        run: |
          echo "Deploying Customer Order Portal to DEV..."
          echo "Version: 1.1.0"
          echo "Deployment to DEV completed successfully."

  deploy-test:
    name: Deploy TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to TEST
        run: |
          echo "Deploying Customer Order Portal to TEST..."
          echo "Version: 1.1.0"
          echo "Deployment to TEST completed successfully."

  change-control:
    name: ServiceNow Change Control
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:
      - name: ServiceNow DevOps Change
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        id: create-change
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Change Control'

  deploy-prod:
    name: Deploy PROD
    needs: change-control
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to PROD
        run: |
          echo "Deploying Customer Order Portal to PROD..."
          echo "Version: 1.1.0"
          echo "Production deployment completed successfully."
