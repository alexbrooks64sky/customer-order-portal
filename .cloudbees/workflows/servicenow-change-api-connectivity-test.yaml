
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ServiceNow Change API Connectivity Test

on:
  workflow_dispatch:

jobs:
  build:
    steps:
      - name: Test ServiceNow Change API
        uses: docker://curlimages/curl:8.11.1
        shell: sh
        env:
          SERVICENOW_USERNAME: cloudbees.dpr.integration
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
        run: |
          set -eu

          echo "Testing CloudBees Change API..."

          status=$(curl --silent --show-error \
            --basic \
            --user "$SERVICENOW_USERNAME:$SERVICENOW_PASSWORD" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{}' \
            --output /tmp/change-response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            "https://dev296876.service-now.com/api/1092915/cloudbees_change_api/change")

          echo "HTTP status: $status"

          if [ "$status" != "200" ]; then
            echo "Change API connectivity test failed."
            cat /tmp/change-response.json
            exit 1
          fi

          if ! grep -q '"changeCreated":false' /tmp/change-response.json; then
            echo "Unexpected API response."
            cat /tmp/change-response.json
            exit 1
          fi

          echo "SUCCESS: CloudBees Change API responded."
          cat /tmp/change-response.json
